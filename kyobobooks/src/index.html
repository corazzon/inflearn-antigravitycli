<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교보문고 컴퓨터/IT 베스트셀러 대시보드</title>
  
  <!-- 구글 웹 폰트 & 폰트어썸 아이콘 CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- 사전 빌드된 대시보드 로컬 데이터 바인딩 -->
  <script src="dashboard_data.js"></script>

  <style>
    /* CSS 변수 시스템 - 테마별 색상 스키마 정의 */
    :root[data-theme="dark"] {
      --bg-color: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent-color: #6366f1; /* Indigo */
      --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7);
      --grid-color: rgba(255, 255, 255, 0.05);
      --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --glass-blur: blur(16px);
      --table-hover: rgba(255, 255, 255, 0.05);
      --modal-bg: rgba(15, 23, 42, 0.95);
    }
    
    :root[data-theme="light"] {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.06);
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --accent-color: #3b82f6; /* Blue */
      --accent-gradient: linear-gradient(135deg, #3b82f6, #06b6d4);
      --grid-color: rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.05);
      --glass-blur: none;
      --table-hover: rgba(0, 0, 0, 0.02);
      --modal-bg: rgba(255, 255, 255, 0.98);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      transition: background-color 0.4s ease, color 0.4s ease;
      min-height: 100vh;
      padding: 2rem;
    }

    /* 헤더 스타일 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--card-border);
    }

    header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    header h1 i {
      -webkit-text-fill-color: initial;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      color: var(--accent-color);
    }

    /* 테마 스위치 스타일 */
    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
      font-size: 0.9rem;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
    }

    .theme-toggle-btn:hover {
      transform: translateY(-2px);
      border-color: var(--accent-color);
    }

    /* Bento Grid 레이아웃 */
    .bento-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    /* 공통 카드 컴포넌트 */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      backdrop-filter: var(--glass-blur);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px 0 rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.3);
    }

    /* 메트릭 카드 (상단 KPI) */
    .metric-card {
      grid-column: span 1;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      position: relative;
      overflow: hidden;
    }

    .metric-icon-box {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.4rem;
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .metric-info h3 {
      font-size: 0.85rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }

    .metric-info .metric-value {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
    }

    /* 차트 레이아웃 분할 */
    .chart-large {
      grid-column: span 2;
      height: 380px;
      display: flex;
      flex-direction: column;
    }

    .chart-small {
      grid-column: span 1;
      height: 380px;
      display: flex;
      flex-direction: column;
    }

    .chart-medium {
      grid-column: span 2;
      height: 380px;
      display: flex;
      flex-direction: column;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .chart-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .chart-title i {
      color: var(--accent-color);
    }

    .chart-wrapper {
      position: relative;
      flex-grow: 1;
      width: 100%;
      height: 80%;
    }

    /* 하단 테이블 섹션 */
    .table-section {
      grid-column: span 4;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .table-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-input-wrapper {
      position: relative;
      width: 320px;
    }

    .search-input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    .search-input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      border-radius: 50px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent-color);
    }

    .filter-select {
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    /* 테이블 요소 스타일 */
    .table-container {
      overflow-x: auto;
      max-height: 500px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background: var(--card-bg);
      padding: 1rem;
      font-weight: 600;
      color: var(--text-sub);
      border-bottom: 2px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 10;
      cursor: pointer;
      user-select: none;
    }

    th:hover {
      color: var(--accent-color);
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid var(--card-border);
      max-width: 250px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    tr {
      transition: background-color 0.2s ease;
      cursor: pointer;
    }

    tr:hover {
      background-color: var(--table-hover);
    }

    .badge-rank {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-weight: 700;
      text-align: center;
      min-width: 30px;
    }

    /* 상위 3위 메달 뱃지 */
    tr:nth-child(1) .badge-rank { background: gold; color: #111; }
    tr:nth-child(2) .badge-rank { background: silver; color: #111; }
    tr:nth-child(3) .badge-rank { background: #cd7f32; color: #fff; }
    tr:nth-child(n+4) .badge-rank { background: var(--card-border); color: var(--text-main); }

    /* 상세 모달 팝업 스타일 */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .modal-content {
      background: var(--modal-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 700px;
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalFadeIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-close {
      position: absolute;
      top: 1.2rem;
      right: 1.5rem;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-sub);
      transition: color 0.2s ease;
    }

    .modal-close:hover {
      color: var(--text-main);
    }

    .modal-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      padding-right: 2rem;
      color: var(--accent-color);
    }

    .modal-meta {
      display: flex;
      gap: 1.5rem;
      color: var(--text-sub);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.8rem;
    }

    .modal-desc-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .modal-desc-body {
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-main);
      max-height: 350px;
      overflow-y: auto;
      white-space: pre-line;
      padding-right: 0.5rem;
    }

    /* 반응형 구조 조정 */
    @media (max-width: 1200px) {
      .bento-container {
        grid-template-columns: repeat(2, 1fr);
      }
      .metric-card { grid-column: span 1; }
      .chart-large, .chart-medium, .chart-small { grid-column: span 2; }
      .table-section { grid-column: span 2; }
    }

    @media (max-width: 768px) {
      .bento-container {
        grid-template-columns: 1fr;
      }
      .metric-card, .chart-large, .chart-medium, .chart-small, .table-section {
        grid-column: span 1;
      }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 및 테마 스위치 -->
  <header>
    <h1><i class="fa-solid fa-chart-line"></i> KYOBO BestSeller Dashboard</h1>
    <button class="theme-toggle-btn" id="themeToggleBtn">
      <i class="fa-solid fa-sun"></i> <span>Light Mode</span>
    </button>
  </header>

  <!-- Bento Grid 레이아웃 -->
  <div class="bento-container">
    
    <!-- 4가지 요약 통계 카드 (Metrics) -->
    <div class="card metric-card">
      <div class="metric-icon-box"><i class="fa-solid fa-book"></i></div>
      <div class="metric-info">
        <h3>총 수집 도서</h3>
        <div class="metric-value" id="metricTotal">0</div>
      </div>
    </div>

    <div class="card metric-card">
      <div class="metric-icon-box" style="background: linear-gradient(135deg, #10b981, #059669);"><i class="fa-solid fa-won-sign"></i></div>
      <div class="metric-info">
        <h3>평균 도서 정가</h3>
        <div class="metric-value" id="metricPrice">0</div>
      </div>
    </div>

    <div class="card metric-card">
      <div class="metric-icon-box" style="background: linear-gradient(135deg, #f59e0b, #d97706);"><i class="fa-solid fa-star"></i></div>
      <div class="metric-info">
        <h3>평균 평점</h3>
        <div class="metric-value" id="metricRating">0.0</div>
      </div>
    </div>

    <div class="card metric-card">
      <div class="metric-icon-box" style="background: linear-gradient(135deg, #ec4899, #be185d);"><i class="fa-solid fa-comments"></i></div>
      <div class="metric-info">
        <h3>최고 리뷰 수</h3>
        <div class="metric-value" id="metricReviews">0</div>
      </div>
    </div>

    <!-- 차트 구역 -->
    <!-- 차트 1: 가격 구간 분포 -->
    <div class="card chart-large">
      <div class="chart-header">
        <div class="chart-title"><i class="fa-solid fa-tags"></i> 정가 및 판매가 분포</div>
      </div>
      <div class="chart-wrapper">
        <canvas id="priceChart"></canvas>
      </div>
    </div>

    <!-- 차트 2: 출판사 점유율 -->
    <div class="card chart-small">
      <div class="chart-header">
        <div class="chart-title"><i class="fa-solid fa-building"></i> 출판사 점유율 (Top 10)</div>
      </div>
      <div class="chart-wrapper">
        <canvas id="publisherChart"></canvas>
      </div>
    </div>

    <!-- 차트 3: 평점 분포 -->
    <div class="card chart-small">
      <div class="chart-header">
        <div class="chart-title"><i class="fa-solid fa-star-half-stroke"></i> 도서 만족도 (평점)</div>
      </div>
      <div class="chart-wrapper">
        <canvas id="ratingChart"></canvas>
      </div>
    </div>

    <!-- 차트 4: 키워드 중요도 (TF-IDF) -->
    <div class="card chart-medium">
      <div class="chart-header">
        <div class="chart-title"><i class="fa-solid fa-key"></i> 상세설명 핵심 키워드 (TF-IDF)</div>
      </div>
      <div class="chart-wrapper">
        <canvas id="keywordChart"></canvas>
      </div>
    </div>

    <!-- 차트 5: 상관관계 (평점 vs 리뷰수) -->
    <div class="card chart-medium">
      <div class="chart-header">
        <div class="chart-title"><i class="fa-solid fa-circle-nodes"></i> 평점 대비 리뷰 수 상관관계</div>
      </div>
      <div class="chart-wrapper">
        <canvas id="scatterChart"></canvas>
      </div>
    </div>

    <!-- 데이터 테이블 섹션 -->
    <div class="card table-section">
      <div class="chart-header">
        <div class="chart-title"><i class="fa-solid fa-list-ol"></i> 도서 상세 목록</div>
      </div>
      
      <!-- 검색 및 필터링 컨트롤러 -->
      <div class="table-controls">
        <div class="search-input-wrapper">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" class="search-input" id="tableSearch" placeholder="도서명, 저자, 출판사 실시간 검색...">
        </div>
        <div>
          <select class="filter-select" id="pubFilter">
            <option value="">전체 출판사 보기</option>
          </select>
        </div>
      </div>

      <!-- 스크롤 가능 테이블 -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th onclick="sortTable('순위')">순위 <i class="fa-solid fa-sort"></i></th>
              <th onclick="sortTable('도서명')">도서명 <i class="fa-solid fa-sort"></i></th>
              <th onclick="sortTable('저자')">저자 <i class="fa-solid fa-sort"></i></th>
              <th onclick="sortTable('출판사')">출판사 <i class="fa-solid fa-sort"></i></th>
              <th onclick="sortTable('출판일')">출판일 <i class="fa-solid fa-sort"></i></th>
              <th onclick="sortTable('정가')">정가 <i class="fa-solid fa-sort"></i></th>
              <th onclick="sortTable('판매가')">판매가 <i class="fa-solid fa-sort"></i></th>
              <th onclick="sortTable('평점')">평점 <i class="fa-solid fa-sort"></i></th>
              <th onclick="sortTable('리뷰수')">리뷰 <i class="fa-solid fa-sort"></i></th>
            </tr>
          </thead>
          <tbody id="booksTableBody">
            <!-- 자바스크립트가 동적으로 행을 생성하여 삽입 -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- 상세 정보 모달 팝업 -->
  <div class="modal" id="bookModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="modal-close" onclick="document.getElementById('bookModal').style.display='none'">&times;</span>
      <div class="modal-title" id="mTitle">도서명</div>
      <div class="modal-meta">
        <span><i class="fa-solid fa-user"></i> <span id="mAuthor">저자</span></span>
        <span><i class="fa-solid fa-building"></i> <span id="mPub">출판사</span></span>
        <span><i class="fa-solid fa-calendar-days"></i> <span id="mDate">출판일</span></span>
      </div>
      <div class="modal-meta" style="margin-top: -1rem; border-bottom: none; font-weight: 600;">
        <span>정가: <span id="mPrice" style="color: var(--text-main)">0원</span></span>
        <span>실판매가: <span id="mSapr" style="color: #10b981;">0원</span></span>
        <span>평점: <span id="mRating" style="color: #f59e0b;">★ 0.0</span></span>
        <span>리뷰: <span id="mReview">0건</span></span>
      </div>
      <div style="border-top: 1px solid var(--card-border); padding-top: 1.2rem;">
        <div class="modal-desc-title">도서 상세 설명 (소개글)</div>
        <div class="modal-desc-body" id="mDesc">상세 설명 본문</div>
      </div>
    </div>
  </div>

  <script>
    // 전역 차트 객체들을 담을 해시맵
    let charts = {};
    let sortColumn = '순위';
    let sortAscending = true;
    let filteredBooks = [];

    // 1. 초기 통계값 세팅
    document.getElementById('metricTotal').textContent = window.DASHBOARD_METRICS.total_books + '건';
    document.getElementById('metricPrice').textContent = window.DASHBOARD_METRICS.avg_price.toLocaleString() + '원';
    document.getElementById('metricRating').textContent = window.DASHBOARD_METRICS.avg_rating + '점';
    document.getElementById('metricReviews').textContent = window.DASHBOARD_METRICS.max_reviews.toLocaleString() + '건';

    // 2. 출판사 필터 드롭다운 채우기
    const publishers = [...new Set(window.DASHBOARD_BOOKS.map(b => b.출판사))].sort();
    const pubFilter = document.getElementById('pubFilter');
    publishers.forEach(pub => {
      const opt = document.createElement('option');
      opt.value = pub;
      opt.textContent = pub;
      pubFilter.appendChild(opt);
    });

    // 3. 차트 초기화 함수
    function initCharts(theme) {
      const textCol = theme === 'dark' ? '#f3f4f6' : '#1f2937';
      const gridCol = theme === 'dark' ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.05)';
      const chartColors = theme === 'dark' ? ['#6366f1', '#a855f7'] : ['#3b82f6', '#06b6d4'];

      Chart.defaults.color = textCol;
      Chart.defaults.font.family = "'Inter', 'Outfit', sans-serif";

      // --- 차트 1: 정가 및 판매가 분포 (Bar) ---
      const priceCtx = document.getElementById('priceChart').getContext('2d');
      if (charts.price) charts.price.destroy();
      charts.price = new Chart(priceCtx, {
        type: 'bar',
        data: {
          labels: window.DASHBOARD_CHARTS.price_chart.labels,
          datasets: [
            {
              label: '정가 기준 분포',
              data: window.DASHBOARD_CHARTS.price_chart.regular,
              backgroundColor: chartColors[0],
              borderRadius: 6
            },
            {
              label: '판매가 기준 분포',
              data: window.DASHBOARD_CHARTS.price_chart.sale,
              backgroundColor: chartColors[1],
              borderRadius: 6
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { grid: { color: 'transparent' } },
            y: { grid: { color: gridCol } }
          }
        }
      });

      // --- 차트 2: 출판사 점유율 (Doughnut) ---
      const pubCtx = document.getElementById('publisherChart').getContext('2d');
      if (charts.pub) charts.pub.destroy();
      charts.pub = new Chart(pubCtx, {
        type: 'doughnut',
        data: {
          labels: window.DASHBOARD_CHARTS.publisher_chart.labels,
          datasets: [{
            data: window.DASHBOARD_CHARTS.publisher_chart.values,
            backgroundColor: [
              '#6366f1', '#a855f7', '#ec4899', '#f43f5e', '#10b981',
              '#14b8a6', '#f59e0b', '#3b82f6', '#84cc16', '#6b7280'
            ],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'right', labels: { boxWidth: 12 } }
          }
        }
      });

      // --- 차트 3: 도서 만족도 (PolarArea) ---
      const ratingCtx = document.getElementById('ratingChart').getContext('2d');
      if (charts.rating) charts.rating.destroy();
      charts.rating = new Chart(ratingCtx, {
        type: 'polarArea',
        data: {
          labels: window.DASHBOARD_CHARTS.rating_chart.labels,
          datasets: [{
            data: window.DASHBOARD_CHARTS.rating_chart.values,
            backgroundColor: [
              'rgba(244, 63, 94, 0.6)', 'rgba(236, 72, 153, 0.6)', 'rgba(168, 85, 247, 0.6)',
              'rgba(99, 102, 241, 0.6)', 'rgba(59, 130, 246, 0.6)', 'rgba(16, 185, 129, 0.6)'
            ],
            borderColor: gridCol
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: { grid: { color: gridCol }, angleLines: { color: gridCol } }
          },
          plugins: {
            legend: { position: 'right', labels: { boxWidth: 12 } }
          }
        }
      });

      // --- 차트 4: TF-IDF 중요 키워드 (Horizontal Bar) ---
      const keyCtx = document.getElementById('keywordChart').getContext('2d');
      if (charts.key) charts.key.destroy();
      charts.key = new Chart(keyCtx, {
        type: 'bar',
        data: {
          labels: window.DASHBOARD_CHARTS.keyword_chart.labels,
          datasets: [{
            label: '평균 TF-IDF 가중치',
            data: window.DASHBOARD_CHARTS.keyword_chart.weights,
            backgroundColor: chartColors[0],
            borderRadius: 4
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { grid: { color: gridCol } },
            y: { grid: { color: 'transparent' } }
          }
        }
      });

      // --- 차트 5: 평점 대비 리뷰 수 상관관계 (Scatter) ---
      const scatCtx = document.getElementById('scatterChart').getContext('2d');
      if (charts.scatter) charts.scatter.destroy();
      charts.scatter = new Chart(scatCtx, {
        type: 'scatter',
        data: {
          datasets: [{
            label: '도서 분포',
            data: window.DASHBOARD_CHARTS.scatter_chart,
            backgroundColor: 'rgba(236, 72, 153, 0.7)',
            borderColor: 'rgba(236, 72, 153, 1)',
            pointRadius: 6,
            pointHoverRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: '평점 (점)' }, grid: { color: gridCol } },
            y: { title: { display: true, text: '리뷰 수 (건)' }, grid: { color: gridCol } }
          },
          plugins: {
            tooltip: {
              callbacks: {
                label: function(context) {
                  const item = context.raw;
                  return `[순위 ${item.rank}위] ${item.title.substring(0, 25)}... (평점: ${item.x}점, 리뷰: ${item.y}건)`;
                }
              }
            }
          }
        }
      });
    }

    // 4. 테이블 렌더링 및 기능 (검색, 정렬, 필터)
    function renderTable() {
      const tbody = document.getElementById('booksTableBody');
      tbody.innerHTML = '';

      filteredBooks.forEach(book => {
        const tr = document.createElement('tr');
        tr.onclick = () => openModal(book);

        tr.innerHTML = `
          <td><span class="badge-rank">${book.순위}</span></td>
          <td style="font-weight: 500;" title="${book.도서명}">${book.도서명}</td>
          <td>${book.저자}</td>
          <td>${book.출판사}</td>
          <td>${book.출판일}</td>
          <td>${book.정가.toLocaleString()}원</td>
          <td style="color: #10b981; font-weight: 600;">${book.판매가.toLocaleString()}원</td>
          <td style="color: #f59e0b; font-weight: 600;"><i class="fa-solid fa-star"></i> ${book.평점.toFixed(2)}</td>
          <td>${book.리뷰수.toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function applyFilters() {
      const searchVal = document.getElementById('tableSearch').value.toLowerCase().trim();
      const pubVal = document.getElementById('pubFilter').value;

      filteredBooks = window.DASHBOARD_BOOKS.filter(book => {
        const matchesSearch = 
          book.도서명.toLowerCase().includes(searchVal) ||
          book.저자.toLowerCase().includes(searchVal) ||
          book.출판사.toLowerCase().includes(searchVal);
          
        const matchesPub = !pubVal || book.출판사 === pubVal;

        return matchesSearch && matchesPub;
      });

      sortTableData();
      renderTable();
    }

    function sortTable(column) {
      if (sortColumn === column) {
        sortAscending = !sortAscending;
      } else {
        sortColumn = column;
        sortAscending = true;
      }
      applyFilters();
    }

    function sortTableData() {
      filteredBooks.sort((a, b) => {
        let valA = a[sortColumn];
        let valB = b[sortColumn];

        if (typeof valA === 'string') {
          return sortAscending ? valA.localeCompare(valB) : valB.localeCompare(valA);
        } else {
          return sortAscending ? valA - valB : valB - valA;
        }
      });
    }

    // 5. 모달 팝업 제어
    function openModal(book) {
      document.getElementById('mTitle').textContent = `[${book.순위}위] ${book.도서명}`;
      document.getElementById('mAuthor').textContent = book.저자;
      document.getElementById('mPub').textContent = book.출판사;
      document.getElementById('mDate').textContent = book.출판일;
      document.getElementById('mPrice').textContent = book.정가.toLocaleString() + '원';
      document.getElementById('mSapr').textContent = book.판매가.toLocaleString() + '원';
      document.getElementById('mRating').textContent = '★ ' + book.평점.toFixed(2) + '점';
      document.getElementById('mReview').textContent = book.리뷰수.toLocaleString() + '건';
      document.getElementById('mDesc').textContent = book.상세설명 || '도서 상세 소개 정보가 제공되지 않습니다.';

      document.getElementById('bookModal').style.display = 'flex';
    }

    function closeModal(event) {
      if (event.target.id === 'bookModal') {
        document.getElementById('bookModal').style.display = 'none';
      }
    }

    // 6. 테마 전환 리스너
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      
      // 버튼 텍스트 및 아이콘 전환
      if (newTheme === 'dark') {
        themeToggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i> <span>Light Mode</span>';
      } else {
        themeToggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i> <span>Dark Mode</span>';
      }
      
      // 차트 테마 실시간 재적용
      initCharts(newTheme);
    });

    // 7. 검색 및 필터 리스너 바인딩
    document.getElementById('tableSearch').addEventListener('input', applyFilters);
    document.getElementById('pubFilter').addEventListener('change', applyFilters);

    // 8. 최초 기동 및 렌더링
    filteredBooks = [...window.DASHBOARD_BOOKS];
    initCharts('dark');
    sortTableData();
    renderTable();

  </script>
</body>
</html>
